name: Live MC Oracles

on:
  workflow_dispatch:
    inputs:
      require_managed:
        description: Fail when a requested managed template is unavailable
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

jobs:
  semantic:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: stable-server
            channel: stable-1.21.4
            suites: core,stdlib-gap
            template: MC_P9_TEMPLATE_DIR
            report: build/runtime-corpus-stable-server.json
          - name: stable-player
            channel: stable-1.21.4
            suites: player
            template: MC_P9_TEMPLATE_DIR
            report: build/runtime-corpus-stable-player.json
          - name: paper-26.2-server
            channel: paper-26.2
            suites: core,stdlib-gap
            template: MC_P9_26_2_TEMPLATE_DIR
            report: build/runtime-corpus-paper-26.2-server.json
    env:
      MC_P9_TEMPLATE_DIR: ${{ vars.MC_P9_TEMPLATE_DIR || vars.MC_SERVER_DIR }}
      MC_P9_26_2_TEMPLATE_DIR: ${{ vars.MC_P9_26_2_TEMPLATE_DIR }}
      REQUIRE_MANAGED: ${{ inputs.require_managed || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: npm run build
      - name: Resolve managed template
        id: template
        shell: bash
        env:
          TEMPLATE_KEY: ${{ matrix.template }}
        run: |
          template="${!TEMPLATE_KEY:-}"
          available=false
          if [ -n "$template" ] && [ -f "$template/paper.jar" ] \
            && [ -d "$template/libraries" ] && [ -d "$template/versions" ] \
            && compgen -G "$template/plugins/redscript-testharness*.jar" >/dev/null; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "path=$template" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ] && [ "$REQUIRE_MANAGED" = true ]; then
            echo "Required template $TEMPLATE_KEY is unavailable" >&2
            exit 1
          fi
      - name: Run managed semantic lane
        if: steps.template.outputs.available == 'true'
        env:
          MC_CORPUS_CHANNEL: ${{ matrix.channel }}
          MC_CORPUS_SUITES: ${{ matrix.suites }}
          MC_CORPUS_TEMPLATE_DIR: ${{ steps.template.outputs.path }}
          MC_CORPUS_REPORT: ${{ matrix.report }}
        run: npm run test:mc-corpus:live
      - name: Upload semantic evidence
        if: always() && steps.template.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mcrs-${{ matrix.name }}-evidence
          path: ${{ matrix.report }}
          if-no-files-found: error

  lifecycle:
    name: lifecycle-${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: stable-1.21.4
            template: MC_P9_TEMPLATE_DIR
            report: build/p9-live-report.json
          - channel: paper-26.2
            template: MC_P9_26_2_TEMPLATE_DIR
            report: build/p9-live-report-26.2.json
    env:
      MC_P9_TEMPLATE_DIR: ${{ vars.MC_P9_TEMPLATE_DIR || vars.MC_SERVER_DIR }}
      MC_P9_26_2_TEMPLATE_DIR: ${{ vars.MC_P9_26_2_TEMPLATE_DIR }}
      REQUIRE_MANAGED: ${{ inputs.require_managed || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: npm run build
      - name: Resolve managed template
        id: template
        shell: bash
        env:
          TEMPLATE_KEY: ${{ matrix.template }}
        run: |
          template="${!TEMPLATE_KEY:-}"
          available=false
          if [ -n "$template" ] && [ -f "$template/paper.jar" ] \
            && [ -d "$template/libraries" ] && [ -d "$template/versions" ] \
            && compgen -G "$template/plugins/redscript-testharness*.jar" >/dev/null; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "path=$template" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ] && [ "$REQUIRE_MANAGED" = true ]; then
            echo "Required template $TEMPLATE_KEY is unavailable" >&2
            exit 1
          fi
      - name: Run lifecycle lane
        if: steps.template.outputs.available == 'true'
        env:
          MC_P9_VERSION_CHANNEL: ${{ matrix.channel }}
          MC_P9_TEMPLATE_DIR: ${{ steps.template.outputs.path }}
          MC_P9_REPORT: ${{ matrix.report }}
        run: npm run test:mc-lifecycle:live
      - name: Upload lifecycle evidence
        if: always() && steps.template.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: p9-${{ matrix.channel }}-evidence
          path: ${{ matrix.report }}
          if-no-files-found: error
